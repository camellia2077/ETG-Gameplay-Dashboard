## Settings file was created for ETG-Gameplay-Dashboard defaults.
## Plugin GUID: etg-gameplay-dashboard

[General]
## Enable or disable the automatic start-of-run loadout grant.
# Setting type: Boolean
# Default value: true
EnableRandomLoadout = true

[Debug]
## Enable verbose Room Rewind information-dialog diagnostics, including dialog state, mouse events, close-button bounds, and close-button activation. Keep disabled for normal play and enable only while debugging the Room Rewind information popup.
# Setting type: Boolean
# Default value: false

[UI]
## Command panel language. Use auto, en, or zh-CN.
# Setting type: String
# Default value: auto
Language = auto

## Command panel keyboard toggle key. Use a Unity KeyCode name such as F7, F8, Insert, or BackQuote.
# Setting type: String
# Default value: F7
CommandPanelKey = F7

## Keyboard shortcuts as targetId=KeyCode pairs separated by commas. Catalog pickups use numeric IDs; currency actions use names such as currency.max_health; room.rewind controls Room rewind. Control panel keys are not allowed.
# Setting type: String
# Default value: (empty)
KeyboardShortcuts = room.rewind=C

## Enable recording of standard and Boss room enemy waves for Rewind. Disabled by default.
# Setting type: Boolean
# Default value: false
RoomEnemyRefreshRecordingEnabled = false

## Room enemy refresh mode. Use rewind or respawn.
# Setting type: String
# Default value: rewind
RoomEnemyRefreshMethod = rewind

## Restore the player's recorded state when rewinding a room. Enabled by default.
# Setting type: Boolean
# Default value: true
PlayerRewindEnabled = true

## Remove room decals, scene drops, currency, and Boss reward pedestals before rewinding. Enabled by default.
# Setting type: Boolean
# Default value: true
RoomRewindCleanupEnabled = true

## Controller shortcut for opening the command panel. Supported values: LB+R3, LB+X, LB+Y, or R3.
# Setting type: String
# Default value: LB+R3
CommandPanelControllerShortcut = LB+R3

## Disable the controller shortcut for opening or closing the command panel. The keyboard shortcut remains available.
# Setting type: Boolean
# Default value: false
DisableCommandPanelControllerShortcut = false

[StartItems]
## Active start-items preset id loaded from ETG-Gameplay-Dashboard preset files.
# Setting type: String
# Default value: default
ActivePreset = default

[Combat]
## Keep Active Item No Cooldown enabled across game launches. Disabled by default.
# Setting type: Boolean
# Default value: false
ActiveItemNoCooldownEnabled = false
